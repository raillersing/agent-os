name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Black
        run: |
          cd backend
          black --check .

      - name: Run isort
        run: |
          cd backend
          isort --check-only .

      - name: Run Flake8
        run: |
          cd backend
          flake8 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t agent-os-backend ./backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t agent-os-frontend ./frontend

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate controlled documentation
        run: python3 scripts/validate_docs.py

      - name: Check OpenAPI parity
        run: python3 scripts/check_openapi_parity.py

      - name: Validate OpenAPI
        run: |
          npx @redocly/cli lint schemas/openapi.yaml

      - name: Validate AsyncAPI
        run: |
          npx @asyncapi/cli validate schemas/asyncapi.yaml

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose configuration
        env:
          POSTGRES_DB: agent_os
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: ci-postgres-password
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          ADMIN_EMAIL: admin@example.local
          ADMIN_PASSWORD: ci-admin-password
        run: docker compose config --quiet
