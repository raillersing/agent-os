openapi: 3.1.0
info:
  title: Agent OS Control Plane API
  description: |
    API for the Agent OS Control Plane — vendor-neutral orchestration,
    governance, and observability for AI agents. This checked-in contract
    describes the routes currently mounted by backend/app/main.py. Provider
    execution, streaming, metrics, policy, and plugin routes are not included
    until they are implemented and tested.
  version: 0.3.0
  contact:
    name: Agent OS Team
    email: api@agent-os.dev
  license:
    name: Proprietary
    url: https://agent-os.dev/license

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/token:
    post:
      operationId: createToken
      summary: Create authentication token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List all agents
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, error]
      responses:
        '200':
          description: Agents listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
    post:
      operationId: createAgent
      summary: Create a new agent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Get agent by ID
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAgent
      summary: Update agent
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgent
      summary: Delete agent
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      responses:
        '204':
          description: Agent deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{agent_id}/run:
    post:
      operationId: createRun
      summary: Create and start a run
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/AgentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs:
    get:
      operationId: listRuns
      summary: List all runs
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
      responses:
        '200':
          description: Runs listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Run' }

  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Get run by ID
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a running run
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/memory:
    post:
      operationId: createMemory
      summary: Add to memory
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
  /api/v1/memory/search:
    get:
      operationId: searchMemory
      summary: Search memory
      tags: [Memory]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Memory results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySearchResults' }

  /api/v1/memory/{key}:
    get:
      operationId: getMemory
      summary: Get memory by key
      tags: [Memory]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMemory
      summary: Delete memory
      tags: [Memory]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Memory deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tools:
    get:
      operationId: listTools
      summary: List available tools
      tags: [Tools]
      responses:
        '200':
          description: Tools listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolList'

  /api/v1/tools/{tool_id}/execute:
    post:
      operationId: executeTool
      summary: Execute a tool
      tags: [Tools]
      parameters:
        - name: tool_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecution'
      responses:
        '200':
          description: Tool executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'

  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List persisted workspaces
      tags: [Control Plane]
      responses:
        '200':
          description: Workspaces listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      operationId: createWorkspace
      summary: Create a workspace boundary
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  /api/v1/missions:
    get:
      operationId: listMissions
      summary: List persisted missions
      tags: [Control Plane]
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Missions listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mission' }
    post:
      operationId: createMission
      summary: Create a workspace-scoped mission
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissionCreate' }
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List workspace-scoped projects
      tags: [Control Plane]
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Projects listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      operationId: createProject
      summary: Create a first-class project in a workspace
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      summary: Get a persisted project
      tags: [Control Plane]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      summary: Update a persisted project with optimistic concurrency
      tags: [Control Plane]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/missions/{mission_id}/status:
    patch:
      operationId: updateMissionStatus
      summary: Update mission status and progress
      tags: [Control Plane]
      parameters:
        - name: mission_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: true
          schema: { type: string }
        - name: progress
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
      responses:
        '200':
          description: Mission updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/automations:
    get:
      operationId: listAutomations
      summary: List persisted automations
      tags: [Control Plane]
      responses:
        '200':
          description: Automations listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Automation' }
    post:
      operationId: createAutomation
      summary: Create a workspace-scoped automation
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationCreate' }
      responses:
        '201':
          description: Automation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Automation' }

  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: List approval records
      tags: [Control Plane]
      responses:
        '200':
          description: Approvals listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
    post:
      operationId: createApproval
      summary: Request a durable human decision
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalCreate' }
      responses:
        '201':
          description: Approval requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }

  /api/v1/approvals/{approval_id}/decision:
    post:
      operationId: decideApproval
      summary: Record an approval decision once
      tags: [Control Plane]
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409':
          description: Approval was already decided

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List append-only workspace audit evidence
      tags: [Control Plane]
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit events listed
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

  /:
    get:
      operationId: root
      summary: Service metadata
      tags: [System]
      security: []
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                required: [name, version, docs]
                properties:
                  name: { type: string }
                  version: { type: string }
                  docs: { type: string }

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List workspace tasks
      tags: [Control Plane]
      parameters: [{ name: workspace_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Tasks listed
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTask
      summary: Create a task
      tags: [Control Plane]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{task_id}/runs:
    post:
      operationId: startExecutionRun
      summary: Start a durable simulator run
      tags: [Control Plane]
      parameters: [{ name: task_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionRunCreate' }
      responses:
        '202':
          description: Run durably accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionRun' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/execution-runs:
    get:
      operationId: listExecutionRuns
      summary: List workspace execution runs
      tags: [Control Plane]
      parameters: [{ name: workspace_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Runs listed
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExecutionRun' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/execution-runs/{run_id}:
    get:
      operationId: getExecutionRun
      summary: Get an execution run with evidence
      tags: [Control Plane]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Run found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionRun' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/execution-runs/{run_id}/cancel:
    post:
      operationId: cancelExecutionRun
      summary: Cancel an execution run
      tags: [Control Plane]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cancellation outcome recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionRun' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    AgentIdParam:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicting state or stale resource version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    ProjectCreate:
      type: object
      required: [workspace_id, name, purpose]
      properties:
        workspace_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        purpose: { type: string, minLength: 1 }
    ProjectUpdate:
      type: object
      required: [expected_version]
      properties:
        name: { type: string, minLength: 1 }
        purpose: { type: string, minLength: 1 }
        state: { type: string, enum: [active, paused, archived] }
        expected_version: { type: integer, minimum: 1 }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [project_id, state, created_at, created_by, version, updated_at]
          properties:
            project_id: { type: string, format: uuid }
            state: { type: string, enum: [active, paused, archived] }
            created_at: { type: string, format: date-time }
            created_by: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            updated_at: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [workspace_id, project_id, mission_id, title, desired_outcome]
      properties:
        workspace_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        desired_outcome: { type: string, minLength: 1 }
    TaskUpdate:
      type: object
      required: [expected_version]
      properties:
        title: { type: string, minLength: 1 }
        desired_outcome: { type: string, minLength: 1 }
        state: { type: string, enum: [draft, ready, active, blocked, completed, cancelled, archived] }
        expected_version: { type: integer, minimum: 1 }
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
        - type: object
          required: [id, state, created_by, version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            state: { type: string }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            version: { type: integer, minimum: 1 }
            updated_at: { type: string, format: date-time }
    ExecutionRunCreate:
      type: object
      required: [workspace_id, input_text, idempotency_key]
      properties:
        workspace_id: { type: string, format: uuid }
        input_text: { type: string, minLength: 1 }
        simulator_profile:
          type: string
          default: success
          pattern: '^(success|retryable_failure|non_retryable_failure|timeout|unknown_cost|slow_success)$'
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        correlation_id: { type: [string, 'null'], format: uuid }
    RunAttempt:
      type: object
      required: [id, attempt_number, state, failure_kind, provider_identity, side_effect_certainty, started_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        attempt_number: { type: integer }
        state: { type: string }
        failure_kind: { type: [string, 'null'] }
        provider_identity: { type: string }
        side_effect_certainty: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
    Artifact:
      type: object
      required: [id, media_type, content_hash, state, created_at]
      properties:
        id: { type: string, format: uuid }
        media_type: { type: string }
        content_hash: { type: string }
        state: { type: string }
        created_at: { type: string, format: date-time }
    ExecutionReceipt:
      type: object
      required: [id, terminal_state, reason_code, simulator_identity, input_hash, output_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        terminal_state: { type: string }
        reason_code: { type: [string, 'null'] }
        simulator_identity: { type: string }
        input_hash: { type: string }
        output_hash: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    ExecutionRun:
      type: object
      required: [id, workspace_id, project_id, mission_id, task_id, task_snapshot_id, state, state_reason, correlation_id, workflow_id, cancellation_state, receipt_state, version, created_at, started_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        task_snapshot_id: { type: string, format: uuid }
        state: { type: string, enum: [accepted, queued, running, retrying, completed, failed, cancelled, cancelling, unknown] }
        state_reason: { type: [string, 'null'] }
        correlation_id: { type: string, format: uuid }
        workflow_id: { type: string }
        cancellation_state: { type: string }
        receipt_state: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
