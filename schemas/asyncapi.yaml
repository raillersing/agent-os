asyncapi: 3.0.0
info:
  title: Agent OS Event Bus
  description: |
    Asynchronous event contracts for Agent OS.
    The local transport binding is provisional; the event contract remains
    independent of the final broker or streaming technology.
  version: 0.3.0
  contact:
    name: Agent OS Team
    email: events@agent-os.dev
  license:
    name: Proprietary
    url: https://agent-os.dev/license

servers:
  local:
    host: localhost:6379
    protocol: redis
    description: Local development transport binding (provisional)
  production:
    host: redis-agent-os:6379
    protocol: redis
    description: Production transport binding (provisional)

channels:
  agents:
    description: Agent lifecycle events
    messages:
      agentCreated:
        $ref: '#/components/messages/AgentCreated'
      agentUpdated:
        $ref: '#/components/messages/AgentUpdated'
      agentDeleted:
        $ref: '#/components/messages/AgentDeleted'
      agentError:
        $ref: '#/components/messages/AgentError'

  runs:
    description: Run lifecycle events
    messages:
      runStarted:
        $ref: '#/components/messages/RunStarted'
      runStepCompleted:
        $ref: '#/components/messages/RunStepCompleted'
      runCompleted:
        $ref: '#/components/messages/RunCompleted'
      runFailed:
        $ref: '#/components/messages/RunFailed'
      runCancelled:
        $ref: '#/components/messages/RunCancelled'

  memory:
    description: Memory events
    messages:
      memoryCreated:
        $ref: '#/components/messages/MemoryCreated'
      memoryUpdated:
        $ref: '#/components/messages/MemoryUpdated'
      memoryDeleted:
        $ref: '#/components/messages/MemoryDeleted'

  approvals:
    description: Approval workflow events
    messages:
      approvalRequested:
        $ref: '#/components/messages/ApprovalRequested'
      approvalGranted:
        $ref: '#/components/messages/ApprovalGranted'
      approvalRejected:
        $ref: '#/components/messages/ApprovalRejected'

  tools:
    description: Tool execution events
    messages:
      toolExecutionStarted:
        $ref: '#/components/messages/ToolExecutionStarted'
      toolExecutionCompleted:
        $ref: '#/components/messages/ToolExecutionCompleted'
      toolExecutionFailed:
        $ref: '#/components/messages/ToolExecutionFailed'

  audit:
    description: Audit trail events
    messages:
      auditEvent:
        $ref: '#/components/messages/AuditEvent'

  projects:
    description: Project aggregate events
    messages:
      projectCreated: { $ref: '#/components/messages/ProjectCreated' }
      projectUpdated: { $ref: '#/components/messages/ProjectUpdated' }
      projectPaused: { $ref: '#/components/messages/ProjectPaused' }
      projectArchived: { $ref: '#/components/messages/ProjectArchived' }

  tasks:
    description: Task aggregate events
    messages:
      taskCreated: { $ref: '#/components/messages/TaskCreated' }
      taskUpdated: { $ref: '#/components/messages/TaskUpdated' }
      taskReady: { $ref: '#/components/messages/TaskReady' }
      taskBlocked: { $ref: '#/components/messages/TaskBlocked' }
      taskCompleted: { $ref: '#/components/messages/TaskCompleted' }
      taskCancelled: { $ref: '#/components/messages/TaskCancelled' }
      taskArchived: { $ref: '#/components/messages/TaskArchived' }
      taskSnapshotCreated: { $ref: '#/components/messages/TaskSnapshotCreated' }

  conversations:
    description: Conversation and message events
    messages:
      conversationCreated: { $ref: '#/components/messages/ConversationCreated' }
      conversationMessageRecorded: { $ref: '#/components/messages/ConversationMessageRecorded' }
      conversationShared: { $ref: '#/components/messages/ConversationShared' }
      conversationShareRevoked: { $ref: '#/components/messages/ConversationShareRevoked' }
      conversationDeletionRequested: { $ref: '#/components/messages/ConversationDeletionRequested' }
      conversationDeleted: { $ref: '#/components/messages/ConversationDeleted' }

operations:
  onAgentCreated:
    action: receive
    channel:
      $ref: '#/channels/agents'
    messages:
      - $ref: '#/channels/agents/messages/agentCreated'

  onRunStarted:
    action: receive
    channel:
      $ref: '#/channels/runs'
    messages:
      - $ref: '#/channels/runs/messages/runStarted'

  onRunCompleted:
    action: receive
    channel:
      $ref: '#/channels/runs'
    messages:
      - $ref: '#/channels/runs/messages/runCompleted'

  publishAgentCreated:
    action: send
    channel:
      $ref: '#/channels/agents'
    messages:
      - $ref: '#/channels/agents/messages/agentCreated'

  publishRunStarted:
    action: send
    channel:
      $ref: '#/channels/runs'
    messages:
      - $ref: '#/channels/runs/messages/runStarted'

components:
  messages:
    ProjectCreated:
      name: ProjectCreated
      title: Project Created
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ProjectUpdated:
      name: ProjectUpdated
      title: Project Updated
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ProjectPaused:
      name: ProjectPaused
      title: Project Paused
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ProjectArchived:
      name: ProjectArchived
      title: Project Archived
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskCreated:
      name: TaskCreated
      title: Task Created
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskUpdated:
      name: TaskUpdated
      title: Task Updated
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskReady:
      name: TaskReady
      title: Task Ready
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskBlocked:
      name: TaskBlocked
      title: Task Blocked
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskCompleted:
      name: TaskCompleted
      title: Task Completed
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskCancelled:
      name: TaskCancelled
      title: Task Cancelled
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskArchived:
      name: TaskArchived
      title: Task Archived
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    TaskSnapshotCreated:
      name: TaskSnapshotCreated
      title: Task Snapshot Created
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ConversationCreated:
      name: ConversationCreated
      title: Conversation Created
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ConversationMessageRecorded:
      name: ConversationMessageRecorded
      title: Conversation Message Recorded
      contentType: application/json
      payload: { $ref: '#/components/schemas/MessageRecordedPayload' }
    ConversationShared:
      name: ConversationShared
      title: Conversation Shared
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ConversationShareRevoked:
      name: ConversationShareRevoked
      title: Conversation Share Revoked
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ConversationDeletionRequested:
      name: ConversationDeletionRequested
      title: Conversation Deletion Requested
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }
    ConversationDeleted:
      name: ConversationDeleted
      title: Conversation Deleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/DomainResourceEventPayload' }

    AgentCreated:
      name: AgentCreated
      title: Agent Created
      summary: Emitted when a new agent is created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AgentCreatedPayload'

    AgentUpdated:
      name: AgentUpdated
      title: Agent Updated
      summary: Emitted when an agent is updated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AgentUpdatedPayload'

    AgentDeleted:
      name: AgentDeleted
      title: Agent Deleted
      summary: Emitted when an agent is deleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AgentDeletedPayload'

    AgentError:
      name: AgentError
      title: Agent Error
      summary: Emitted when an agent encounters an error
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AgentErrorPayload'

    RunStarted:
      name: RunStarted
      title: Run Started
      summary: Emitted when a run begins execution
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunStartedPayload'

    RunStepCompleted:
      name: RunStepCompleted
      title: Run Step Completed
      summary: Emitted when a run step completes
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunStepCompletedPayload'

    RunCompleted:
      name: RunCompleted
      title: Run Completed
      summary: Emitted when a run completes successfully
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunCompletedPayload'

    RunFailed:
      name: RunFailed
      title: Run Failed
      summary: Emitted when a run fails
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunFailedPayload'

    RunCancelled:
      name: RunCancelled
      title: Run Cancelled
      summary: Emitted when a run is cancelled
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunCancelledPayload'

    MemoryCreated:
      name: MemoryCreated
      title: Memory Created
      summary: Emitted when memory is added
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryCreatedPayload'

    MemoryUpdated:
      name: MemoryUpdated
      title: Memory Updated
      summary: Emitted when memory is updated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryUpdatedPayload'

    MemoryDeleted:
      name: MemoryDeleted
      title: Memory Deleted
      summary: Emitted when memory is deleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryDeletedPayload'

    ApprovalRequested:
      name: ApprovalRequested
      title: Approval Requested
      summary: Emitted when an approval is requested
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalRequestedPayload'

    ApprovalGranted:
      name: ApprovalGranted
      title: Approval Granted
      summary: Emitted when an approval is granted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalGrantedPayload'

    ApprovalRejected:
      name: ApprovalRejected
      title: Approval Rejected
      summary: Emitted when an approval is rejected
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalRejectedPayload'

    ToolExecutionStarted:
      name: ToolExecutionStarted
      title: Tool Execution Started
      summary: Emitted when a tool starts executing
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolExecutionStartedPayload'

    ToolExecutionCompleted:
      name: ToolExecutionCompleted
      title: Tool Execution Completed
      summary: Emitted when a tool completes execution
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolExecutionCompletedPayload'

    ToolExecutionFailed:
      name: ToolExecutionFailed
      title: Tool Execution Failed
      summary: Emitted when a tool execution fails
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolExecutionFailedPayload'

    AuditEvent:
      name: AuditEvent
      title: Audit Event
      summary: Generic audit trail event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuditEventPayload'

  schemas:
    DomainResourceEventPayload:
      type: object
      required: [event_id, timestamp, event_type, workspace_id, resource_type, resource_id, aggregate_version, correlation_id, causation_id, actor_chain, retention_profile, classification]
      properties:
        event_id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        event_type: { type: string }
        workspace_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [project, task, conversation] }
        resource_id: { type: string, format: uuid }
        aggregate_version: { type: integer, minimum: 1 }
        correlation_id: { type: string, format: uuid }
        causation_id: { type: [string, 'null'], format: uuid }
        actor_chain: { type: array, items: { type: object } }
        retention_profile: { type: string, pattern: '^R[0-6]$' }
        classification: { type: string }
        data: { type: object }
    MessageRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/DomainResourceEventPayload'
        - type: object
          required: [conversation_id, message_id, role, content_reference, provider_reference]
          properties:
            resource_type: { type: string, enum: [message] }
            conversation_id: { type: string, format: uuid }
            message_id: { type: string, format: uuid }
            role: { type: string, enum: [user, assistant, system, tool, event] }
            content_reference: { type: object }
            provider_reference: { type: [object, 'null'] }

    AgentCreatedPayload:
      type: object
      required: [event_id, timestamp, agent]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        agent:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            model:
              type: string

    AgentUpdatedPayload:
      type: object
      required: [event_id, timestamp, agent_id, changes]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
        changes:
          type: object

    AgentDeletedPayload:
      type: object
      required: [event_id, timestamp, agent_id]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string

    AgentErrorPayload:
      type: object
      required: [event_id, timestamp, agent_id, error]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    RunStartedPayload:
      type: object
      required: [event_id, timestamp, run]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        run:
          type: object
          properties:
            id:
              type: string
            agent_id:
              type: string
            prompt:
              type: string

    RunStepCompletedPayload:
      type: object
      required: [event_id, timestamp, run_id, step]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        run_id:
          type: string
        step:
          type: object
          properties:
            index:
              type: integer
            type:
              type: string
            duration_ms:
              type: integer

    RunCompletedPayload:
      type: object
      required: [event_id, timestamp, run_id, result]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        run_id:
          type: string
        result:
          type: object
          properties:
            tokens_used:
              type: integer
            cost:
              type: number

    RunFailedPayload:
      type: object
      required: [event_id, timestamp, run_id, error]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        run_id:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    RunCancelledPayload:
      type: object
      required: [event_id, timestamp, run_id]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        run_id:
          type: string

    MemoryCreatedPayload:
      type: object
      required: [event_id, timestamp, memory]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        memory:
          type: object
          properties:
            key:
              type: string
            content:
              type: string

    MemoryUpdatedPayload:
      type: object
      required: [event_id, timestamp, key]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        key:
          type: string

    MemoryDeletedPayload:
      type: object
      required: [event_id, timestamp, key]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        key:
          type: string

    ApprovalRequestedPayload:
      type: object
      required: [event_id, timestamp, request_id, action]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
        action:
          type: object
          properties:
            type:
              type: string
            resource:
              type: string

    ApprovalGrantedPayload:
      type: object
      required: [event_id, timestamp, request_id]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    ApprovalRejectedPayload:
      type: object
      required: [event_id, timestamp, request_id, reason]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
        reason:
          type: string

    ToolExecutionStartedPayload:
      type: object
      required: [event_id, timestamp, execution_id, tool_id]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        execution_id:
          type: string
        tool_id:
          type: string

    ToolExecutionCompletedPayload:
      type: object
      required: [event_id, timestamp, execution_id]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        execution_id:
          type: string
        result:
          type: object

    ToolExecutionFailedPayload:
      type: object
      required: [event_id, timestamp, execution_id, error]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        execution_id:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    AuditEventPayload:
      type: object
      required: [event_id, timestamp, action, actor]
      properties:
        event_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
              enum: [user, agent, system]
        resource:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
        details:
          type: object
